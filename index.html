function convert(){
 sg.clearRect(0,0,COLS,ROWS);
 sg.drawImage(src,0,0,COLS,ROWS);
 const d=sg.getImageData(0,0,COLS,ROWS).data,n=RAMP.length;
 for(let i=0;i<N;i++){
  const r=d[i*4],gg=d[i*4+1],b=d[i*4+2];
  const lum=(.299*r+.587*gg+.114*b)/255;

  const shaped=Math.pow(clamp((lum-.025)/.94),.78);

  FR[i]=Math.min(255,Math.round(r*lift*(1-mix)+255*mix));

 }
}

}
